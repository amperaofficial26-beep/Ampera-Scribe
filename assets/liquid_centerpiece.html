<style>
  .liquid-centerpiece {
    position: relative;
    width: 100%;
    height: clamp(220px, 30vw, 360px);
    margin: 0 auto 1rem;
    overflow: visible;
    background: transparent !important;
  }

  .liquid-centerpiece canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: transparent !important;
  }

  .liquid-logo-error {
    position: absolute;
    inset: 0;
    display: none;
    place-items: center;
    color: #cfd3ff;
    font: 16px system-ui, sans-serif;
    text-align: center;
    padding: 24px;
  }
</style>
<div class="liquid-centerpiece">
  <canvas aria-label="Bola cairan warna-warni yang berubah menjadi huruf A"></canvas>
  <div class="liquid-logo-error">Browser ini tidak mendukung WebGL, jadi animasi tidak bisa ditampilkan.</div>
  <script>
  (() => {
const root = document.currentScript.parentElement;
const cv = root.querySelector('canvas');
const gl = cv.getContext('webgl', { alpha: true, antialias: true, premultipliedAlpha: false });
if (!gl) { root.querySelector('.liquid-logo-error').style.display = 'grid'; }
else {
const vs = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const fs = `
precision highp float;
uniform vec2 res; uniform float time; uniform float m; uniform float e; uniform sampler2D tx;

float seg(vec2 p, vec2 a, vec2 b){
  vec2 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0., 1.);
  return length(pa - ba * h);
}
vec3 pal(float x, vec3 ph){ return .5 + .5 * cos(6.2831 * (x + ph)); }

void main(){
  vec2 p = (gl_FragCoord.xy - .5 * res) / min(res.x * .95, res.y * .85) * 2.75;
  p.y += 0.02;

  // bentuk: bulat -> huruf A (campuran jarak, jadi perubahannya mulus)
  float dc = length(p) - .55;
  vec2 pq = p;
  float dA = min(min(seg(pq, vec2(0., .44), vec2(-.4, -.46)),
                     seg(pq, vec2(0., .44), vec2(.4, -.46))),
                     seg(pq, vec2(-.21, -.16), vec2(.21, -.16))) - .13;
  float d = mix(dc, dA, m);

  // jarum-jarum yang menonjol bergantian (genap lalu ganjil), hanya saat bulat
  float sp = atan(p.y, p.x) / 6.2831853 * 16.;
  float idx = floor(sp);
  float k = abs(fract(sp) - .5);
  float prof = pow(max(0., 1. - k * 2. * 1.25), 2.2);
  float rnd = fract(sin(idx * 127.1) * 43758.5);
  float alt = mod(idx, 2.) * 3.14159 + rnd * .6;
  float amp = smoothstep(.0, 1., .5 + .5 * sin(time * 2.4 + alt));
  d -= .2 * amp * prof * (1. - m);

  // teks ".Scribe" keluar dari huruf A sebagai cairan, lalu masuk lagi
  if (e > 0.) {
    float g = smoothstep(0., .25, e);
    float s = mix(.14, .42, e);
    vec2 c = mix(vec2(0., -.16), vec2(.6, .47), e);
    vec2 q = (p - c) / s;
    q += .06 * sin(vec2(q.y * 7. + time * 3., q.x * 5. + time * 2.4)) * sin(3.14159 * e);
    vec2 tuv = vec2(q.x / 1.7 + .5, .5 - q.y / .425);
    float dt = (texture2D(tx, clamp(tuv, 0., 1.)).r - .5) * .2656
             + length(max(abs(q) - vec2(.85, .2125), 0.));
    dt = dt * s - .007 * g + (1. - g) * .3;
    float h = max(.16 - abs(d - dt), 0.) / .16;
    d = min(d, dt) - h * h * .04;
  }
  // cairan di dalam
  float t = time * .45;
  vec2 w = p * 2.2;
  for (int i = 0; i < 4; i++){
    w += .55 * vec2(sin(w.y * 1.6 + t + float(i)), cos(w.x * 1.6 - t * 1.2 + float(i) * 1.7));
  }
  float f = .5 + .5 * sin(w.x * 1.8 + w.y * 1.3 + t * 2.);
  float g = .5 + .5 * sin(w.x * 1.1 - w.y * 1.7 - t * 1.5);
  vec3 col = pal(f * .7 + g * .35 + time * .07, vec3(0., .33, .67));
  col = mix(col, vec3(dot(col, vec3(.33))), -.35);   // tambah saturasi

  float depth = clamp(-d / mix(.28, .12, e), 0., 1.);
  col *= .72 + .5 * depth;
  vec3 rim = pal(time * .12 + .5, vec3(0., .33, .67));
  col += rim * pow(1. - depth, 3.) * .65;            // cahaya tepi
  float hl = exp(-length(p - vec2(-.2, .26)) * 5.) * (1. - .75 * m);
  col += vec3(.9) * hl * .35;                        // kilau
  col += .12 * sin(vec3(w.x, w.y, w.x + w.y) * 3. + time) * depth;

  // glow luar, warnanya ikut berganti
  vec3 gc = pal(time * .14, vec3(0., .33, .67));
  float pulse = .85 + .15 * sin(time * 2.);
  float glow = exp(-max(d, 0.) * 4.5) * .75 * pulse + exp(-max(d, 0.) * 14.) * .5;
  vec3 outc = gc * glow;

  float mask = smoothstep(.006, -.006, d);
  float alpha = clamp(mask + glow * .75, 0., 1.);
  gl_FragColor = vec4(mix(outc, col, mask), alpha);
}`;
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
const pr = gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs));
gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(pr); gl.useProgram(pr);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, 'a');
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const uR = gl.getUniformLocation(pr, 'res'), uT = gl.getUniformLocation(pr, 'time'), uM = gl.getUniformLocation(pr, 'm'), uE = gl.getUniformLocation(pr, 'e');

// tekstur jarak (SDF) untuk tulisan ".Scribe"
(function(){
  const W = 1024, H = 256, R = 80, INF = 1e20;
  const c2 = document.createElement('canvas'); c2.width = W; c2.height = H;
  const x = c2.getContext('2d');
  const fam = '"Arial Black","Helvetica Neue",Arial,sans-serif';
  x.font = '900 200px ' + fam;
  let mt = x.measureText('.Scribe');
  const size = 200 * Math.min(940 / mt.width, 200 / mt.actualBoundingBoxAscent);
  x.font = '900 ' + size + 'px ' + fam; x.textAlign = 'center'; x.fillStyle = '#fff';
  mt = x.measureText('.Scribe');
  x.fillText('.Scribe', W / 2, H / 2 + (mt.actualBoundingBoxAscent - mt.actualBoundingBoxDescent) / 2);
  const px = x.getImageData(0, 0, W, H).data, N = W * H;
  const n = Math.max(W, H), d = new Float32Array(n), v = new Int32Array(n), z = new Float32Array(n + 1), tmp = new Float32Array(n);
  function e1(f, len){
    let k = 0; v[0] = 0; z[0] = -INF; z[1] = INF;
    for (let q = 1; q < len; q++){
      let s;
      for (;;){ const p = v[k]; s = ((f[q] + q * q) - (f[p] + p * p)) / (2 * q - 2 * p); if (s <= z[k]) k--; else break; }
      k++; v[k] = q; z[k] = s; z[k + 1] = INF;
    }
    k = 0;
    for (let q = 0; q < len; q++){ while (z[k + 1] < q) k++; const p = v[k]; d[q] = (q - p) * (q - p) + f[p]; }
  }
  function edt(f){
    for (let i = 0; i < W; i++){ for (let j = 0; j < H; j++) tmp[j] = f[j * W + i]; e1(tmp, H); for (let j = 0; j < H; j++) f[j * W + i] = d[j]; }
    for (let j = 0; j < H; j++){ for (let i = 0; i < W; i++) tmp[i] = f[j * W + i]; e1(tmp, W); for (let i = 0; i < W; i++) f[j * W + i] = d[i]; }
  }
  const fo = new Float32Array(N), fi = new Float32Array(N);
  for (let i = 0; i < N; i++){ const on = px[i * 4 + 3] > 127; fo[i] = on ? 0 : INF; fi[i] = on ? INF : 0; }
  edt(fo); edt(fi);
  const out = new Uint8Array(N);
  for (let i = 0; i < N; i++){ const sd = Math.sqrt(fo[i]) - Math.sqrt(fi[i]); out[i] = Math.max(0, Math.min(255, Math.round((.5 + sd / (2 * R)) * 255))); }
  const tex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, W, H, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, out);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1i(gl.getUniformLocation(pr, 'tx'), 0);
})();

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(cv.clientWidth * dpr);
  cv.height = Math.round(cv.clientHeight * dpr);
  gl.viewport(0, 0, cv.width, cv.height);
}
const ro = new ResizeObserver(resize); ro.observe(root);
window.addEventListener('resize', resize); resize();

// siklus: bulat 5 dtk → berubah 2 dtk → tahap A 10,5 dtk → berubah 2 dtk
// tahap A: A saja 2 dtk, teks keluar 2 dtk, teks tampil 4 dtk, teks masuk lagi 2 dtk, A saja 0,5 dtk
const HOLD = 5, MORPH = 2, ASTAGE = 10.5, CYCLE = HOLD + MORPH + ASTAGE + MORPH;
const ease = x => x * x * x * (x * (x * 6 - 15) + 10);
function state(t){
  const c = t % CYCLE;
  if (c < HOLD) return [0, 0];
  if (c < HOLD + MORPH) return [ease((c - HOLD) / MORPH), 0];
  const a = c - HOLD - MORPH;
  if (a < ASTAGE){
    if (a < 2) return [1, 0];
    if (a < 4) return [1, ease((a - 2) / 2)];
    if (a < 8) return [1, 1];
    if (a < 10) return [1, 1 - ease((a - 8) / 2)];
    return [1, 0];
  }
  return [1 - ease((c - HOLD - MORPH - ASTAGE) / MORPH), 0];
}
const t0 = performance.now();
(function frame(){
  const t = (performance.now() - t0) / 1000;
  gl.uniform2f(uR, cv.width, cv.height);
  gl.uniform1f(uT, t);
  const st = state(t);
  gl.uniform1f(uM, st[0]);
  gl.uniform1f(uE, st[1]);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  if (!root.isConnected) return;
  requestAnimationFrame(frame);
})();
}
  })();
  </script>
</div>
